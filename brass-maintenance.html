<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brass: Lancashire — Updating</title>
  <meta http-equiv="refresh" content="20">
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-light: #16213e;
      --surface: #0f3460;
      --accent: #e94560;
      --gold: #d4a843;
      --text: #e0e0e0;
      --text-muted: #888;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 60px; }
    h1 { color: var(--gold); font-size: 28px; margin: 0 0 6px; letter-spacing: 0.3px; }
    .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px; margin-right: 10px;
      border: 2px solid rgba(212, 168, 67, 0.25);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card {
      background: var(--bg-light);
      border: 1px solid #2a3a5a;
      border-radius: 8px;
      padding: 18px 22px;
      margin-bottom: 18px;
    }
    .card h2 {
      color: var(--gold);
      font-size: 18px;
      margin: 0 0 10px;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
    }
    .card h3 { color: var(--gold); font-size: 15px; margin: 12px 0 6px; }
    .card ul { padding-left: 18px; margin: 6px 0; }
    .card li { margin: 4px 0; line-height: 1.5; font-size: 13px; }
    .card strong { color: #fff; }
    .card em { color: var(--gold); font-style: normal; }
    .card code {
      background: rgba(255,255,255,0.06);
      padding: 1px 5px; border-radius: 3px;
      font-size: 11px; color: #ffd166;
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin-bottom: 24px;
    }
    .pill {
      background: rgba(212, 168, 67, 0.12);
      border: 1px solid rgba(212, 168, 67, 0.4);
      color: var(--gold);
      padding: 4px 10px; border-radius: 12px;
      font-size: 11px; font-weight: bold;
    }
    .footer {
      margin-top: 32px; text-align: center;
      color: var(--text-muted); font-size: 12px;
    }
    .footer button {
      margin-top: 10px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid #4a6a8a;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .footer button:hover { background: #1a4a7a; }
    .err { color: var(--accent); font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span class="spinner"></span>Brass: Lancashire is updating</h1>
    <p class="sub">A new version is being deployed. The site will be back in a few seconds — this page auto-refreshes every 20 seconds.</p>

    <div class="meta" id="meta-row">
      <span class="pill" id="version-pill">checking version…</span>
    </div>

    <div class="card" id="changelog-card">
      <h2>What's changing</h2>
      <div id="changelog-body" style="color: var(--text-muted); font-size: 13px;">Loading the latest release notes from GitHub…</div>
    </div>

    <div class="footer">
      <div>If this page lingers more than a minute, the deploy probably failed.</div>
      <button onclick="location.reload()">Try again now</button>
    </div>
  </div>

  <script>
    // Pull the latest section of CHANGELOG.md from GitHub raw, render it.
    // Public repo so no auth needed. Fail gracefully — if GitHub is slow or
    // blocked, we still show the spinner + auto-refresh keeps trying the site.
    const RAW_URL = 'https://raw.githubusercontent.com/xaiworld/brass/main/CHANGELOG.md';

    function escapeHtml(s) {
      return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    }

    function mdToHtml(md) {
      // Tiny inline-markdown converter — handles **bold**, *italic*, `code`,
      // ### / ## / # headings, and -bullet lists. Good enough for changelog.
      const lines = md.split('\n');
      let html = '';
      let inList = false;
      for (const raw of lines) {
        let line = escapeHtml(raw);
        line = line
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*]+?)\*(?!\*)/g, '$1<em>$2</em>');
        if (/^### /.test(raw)) {
          if (inList) { html += '</ul>'; inList = false; }
          html += '<h3>' + line.replace(/^### /, '') + '</h3>';
        } else if (/^## /.test(raw)) {
          if (inList) { html += '</ul>'; inList = false; }
          html += '<h2>' + line.replace(/^## /, '') + '</h2>';
        } else if (/^# /.test(raw)) {
          if (inList) { html += '</ul>'; inList = false; }
          html += '<h1>' + line.replace(/^# /, '') + '</h1>';
        } else if (/^- /.test(raw)) {
          if (!inList) { html += '<ul>'; inList = true; }
          html += '<li>' + line.replace(/^- /, '') + '</li>';
        } else if (raw.trim() === '') {
          if (inList) { html += '</ul>'; inList = false; }
        } else {
          if (inList) { html += '</ul>'; inList = false; }
          html += '<p>' + line + '</p>';
        }
      }
      if (inList) html += '</ul>';
      return html;
    }

    function pickLatestSection(md) {
      // The changelog uses "### Title (vN.N.N)" headings per release. Grab the
      // bottom-most one (newest) along with the bullets that follow until the
      // next "###" or "---" or end of file.
      const lines = md.split('\n');
      let lastStart = -1;
      for (let i = 0; i < lines.length; i++) {
        if (/^### .*\(v[\d.]+/.test(lines[i])) lastStart = i;
      }
      if (lastStart === -1) return null;
      const out = [];
      for (let i = lastStart; i < lines.length; i++) {
        const ln = lines[i];
        if (i > lastStart && /^### /.test(ln)) break;
        if (/^---\s*$/.test(ln)) break;
        out.push(ln);
      }
      return out.join('\n');
    }

    async function loadChangelog() {
      const body = document.getElementById('changelog-body');
      const pill = document.getElementById('version-pill');
      try {
        const r = await fetch(RAW_URL, { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const md = await r.text();
        const section = pickLatestSection(md);
        if (!section) throw new Error('no recent section found');
        const versionMatch = section.match(/v(\d+\.\d+\.\d+)/);
        if (versionMatch) pill.textContent = 'Deploying v' + versionMatch[1];
        body.style.color = 'var(--text)';
        body.innerHTML = mdToHtml(section);
      } catch (e) {
        body.innerHTML = '<div class="err">Couldn\'t fetch release notes: ' + escapeHtml(e.message) + '</div>'
          + '<div style="margin-top:8px;font-size:12px;color:var(--text-muted)">The site will be back shortly — this page refreshes automatically every 20 seconds.</div>';
      }
    }

    loadChangelog();
  </script>
</body>
</html>
