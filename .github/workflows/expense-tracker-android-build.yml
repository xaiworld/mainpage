name: Expense Tracker Android Build

on:
  push:
    branches:
      - claude/shared-expense-tracker-android-q4xitp
    paths:
      - 'expense-tracker-android/**'
      - '.github/workflows/expense-tracker-android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense-tracker-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-debug-apk
          path: expense-tracker-android/app/build/outputs/apk/debug/*.apk
